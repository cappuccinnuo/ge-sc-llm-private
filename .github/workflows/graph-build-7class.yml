# CPU check of the seven-category pipeline on a modern stack (Python 3.11, torch 2.4,
# DGL 2.4, networkx 3): the same library generation the RTX 5080 image uses, minus
# the GPU. GitHub runners have no GPU, so this proves portability and correctness of
# graph construction, and that training starts and finishes; it is not a results run.
name: graph-build-7class

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DGLBACKEND: pytorch
  MANDO_DATA_DIR: ${{ github.workspace }}/data
  TREE_SITTER_LIB_DIR: ${{ github.workspace }}/build/linux-x86_64
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The full checkout is ~14 GB (sealed DFG/node-sem/edge-sem artifacts) and fills
      # a runner's disk; this sparse set is ~80 MB and holds everything the build,
      # training and tests read.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/scripts/DFG/
            /scripts/DFG/dfg_v2/hgt_layer.py
            !/scripts/node_sem/
            !/scripts/edge_sem/
            /scripts/edge_sem/hgt_edge.py
            !/experiments/
            /experiments/ge-sc-data/source_code/*/source_files/
            /experiments/ge-sc-data/source_code/reentrancy/graph_labels.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/requirements.txt
      - name: Install CPU torch + DGL and the shared requirements
        run: |
          pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          pip install dgl==2.4.0 -f https://data.dgl.ai/wheels/torch-2.4/repo.html
          pip install -r docker/requirements.txt
          python -c "import torch, dgl, networkx, numpy; print(torch.__version__, dgl.__version__, networkx.__version__, numpy.__version__)"
      - name: Fetch pinned label sources
        run: bash scripts/graph_build/fetch_labels.sh
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Sealed sources untouched by this branch
        run: |
          git fetch --depth 1 --filter=blob:none origin "${{ github.base_ref || 'edge-sem' }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -vE '^(scripts/graph_build/|scripts/train_all_categories.sh|tests/test_graph_build.py|tests/conftest.py|docker/|docs/migration_7class_build.md|.github/)'; then
            echo "files outside the new-file allow-list changed (sealed manifests pin them)"; exit 1
          fi

  build-and-train:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        category:
          - access_control
          - arithmetic
          - denial_of_service
          - front_running
          - reentrancy
          - time_manipulation
          - unchecked_low_level_calls
    steps:
      # The full checkout is ~14 GB (sealed DFG/node-sem/edge-sem artifacts) and fills
      # a runner's disk; this sparse set is ~80 MB and holds everything the build,
      # training and tests read.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/scripts/DFG/
            /scripts/DFG/dfg_v2/hgt_layer.py
            !/scripts/node_sem/
            !/scripts/edge_sem/
            /scripts/edge_sem/hgt_edge.py
            !/experiments/
            /experiments/ge-sc-data/source_code/*/source_files/
            /experiments/ge-sc-data/source_code/reentrancy/graph_labels.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/requirements.txt
      - name: Install CPU torch + DGL and the shared requirements
        run: |
          pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          pip install dgl==2.4.0 -f https://data.dgl.ai/wheels/torch-2.4/repo.html
          pip install -r docker/requirements.txt
      - name: Fetch pinned label sources
        run: bash scripts/graph_build/fetch_labels.sh
      - name: Build graphs from raw .sol and check against paper Table 1 + baseline
        run: python -m scripts.graph_build --categories ${{ matrix.category }} --check
      - name: Smoke-train both phases, nodetype (1 epoch, 2 folds, CPU)
        run: NUM_EPOCHS=1 K_FOLDS=2 bash scripts/train_all_categories.sh nodetype ${{ matrix.category }}
      - name: Smoke-train both phases, tokenizer features (1 epoch, 2 folds, CPU)
        run: NUM_EPOCHS=1 K_FOLDS=2 bash scripts/train_all_categories.sh inside_token ${{ matrix.category }}
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ matrix.category }}
          path: experiments/ge-sc-data/source_code/${{ matrix.category }}/build_report.json
          if-no-files-found: warn
