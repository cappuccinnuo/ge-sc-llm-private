# pipeline: on a clean machine, build every Dataset A category from source (hcg),
# prove it reproduces the authors' graphs and the Oct 10 label policy, augment it with
# the DFG layers (dfg), prove those match the pre-restructure code and the sealed
# Prompt 8 evidence, derive the NodeSem features (nodesem) and the EdgeSem F4 edges and
# edge attributes (edgesem) and prove them equal to the unmodified NodeSem/EdgeSem code
# and their sealed evidence, and smoke-train the MANDO-LLM baselines, the DFG profiles,
# the NodeSem configurations and the EdgeSem profiles. CPU only (no GPU on runners).
#
# Cost control (private repository, metered minutes): every pull request runs only the
# unit job (~7 min). The seven category jobs (~2.5 h each) run when started by hand
# (Actions -> pipeline -> Run workflow) or on a pull request labelled `full-ci`; the same
# Dataset A tests run on the GPU machine with docker/smoke.sh. Changes that touch only
# documentation or docker/ (never executed here) do not trigger CI.
name: pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "docker/**"
      - ".dockerignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DGLBACKEND: pytorch
  MANDO_DATA_DIR: ${{ github.workspace }}/data
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/experiments/
            /experiments/ge-sc-data/source_code/*/source_files/
            !/compile_repair/
            !/docs/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch 2.2 + DGL 2.1, the newest DGL on PyPI)
        run: |
          pip install torch==2.2.1 --index-url https://download.pytorch.org/whl/cpu
          pip install dgl==2.1.0 "numpy<2" requests "pydantic>=2"
          pip install --no-deps torchdata==0.7.1
          pip install "numpy<2" -r requirements.txt
      - name: hcg, dfg, nodesem, edgesem, mando and benchmark unit tests (dfg.train against the sealed Prompt 8 folds/groups)
        run: |
          python -m pytest -q tests/hcg/test_units.py tests/hcg/test_models.py tests/dfg/test_units.py tests/dfg/test_train.py \
            tests/nodesem/test_units.py tests/edgesem/test_units.py tests/mando tests/benchmark

  category:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        category:
          - access_control
          - arithmetic
          - denial_of_service
          - front_running
          - reentrancy
          - time_manipulation
          - unchecked_low_level_calls
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/experiments/
            /experiments/ge-sc-data/source_code/*/source_files/
            !/compile_repair/
            !/docs/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch==2.2.1 --index-url https://download.pytorch.org/whl/cpu
          pip install dgl==2.1.0 "numpy<2" requests "pydantic>=2"
          pip install --no-deps torchdata==0.7.1
          pip install "numpy<2" -r requirements.txt
      - name: Fetch pinned label sources
        run: python -m hcg fetch --no-models
      - name: hcg build from source (with CodeT5+ tokens), compared with the authors' graphs
        run: python -m hcg build --categories ${{ matrix.category }} --out out/hcg
      - name: hcg reproduces the Oct 10 label policy node for node
        run: python -m pytest -q tests/hcg/test_dataset_a.py -k ${{ matrix.category }}
      - name: MANDO-LLM HGT consumes the graphs (1 epoch, 2 folds; nodetype and tokens; both levels)
        run: |
          B=out/hcg/A/${{ matrix.category }}
          S=experiments/ge-sc-data/source_code/${{ matrix.category }}/source_files
          for F in nodetype inside_token; do
            python -u -m mando.graph_classifier --compressed_graph $B/contract_level.gpickle \
              --label $B/graph_labels.json --dataset $S --testset $S --node_feature $F \
              --output_models /tmp/m/c_$F.pth --log_dir /tmp/l/c_$F \
              --num_epochs 1 --k_folds 2 --seed 1 --no_progress
            python -u -m mando.node_classifier --compressed_graph $B/line_level.gpickle \
              --dataset $S --testset $S --node_feature $F \
              --output_models /tmp/m/n_$F.pth --log_dir /tmp/l/n_$F \
              --num_epochs 1 --k_folds 2 --seed 1 --no_progress
          done
      - name: dfg build L1-L3 (env_source tokens from the same tokenizer)
        run: python -m dfg build --categories ${{ matrix.category }} --hcg out/hcg --out out/dfg
      - name: dfg layers match the pre-restructure code and the sealed Prompt 8 evidence
        run: python -m pytest -q tests/dfg/test_dataset_a.py -k ${{ matrix.category }}
      - name: dfg training smoke (G0 vs G3R, fold 0, 2 epochs, both tasks; original and anonymized views)
        run: |
          python -m dfg train --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg \
            --out out/runs --profiles G0 G3R --folds 0 --epochs 2 --device cpu
          python -m dfg train --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg \
            --out out/runs_anon --profiles G0 G3R --folds 0 --epochs 2 --device cpu --features anonymous
      - name: benchmark smoke (paper and grouped protocols, G0 and G3R, fold 0, 1 epoch; upstream trainers, 1 epoch)
        run: |
          python -m benchmark run --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg \
            --out out/runs_benchmark --protocols paper grouped --profiles G0 G3R --folds 0 --epochs 1 --device cpu
          python -m benchmark run --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg \
            --out out/runs_benchmark --protocols upstream --epochs 1 --device cpu
      - name: nodesem analysis equals the unmodified NodeSem code and the sealed NodeSem evidence
        run: python -m pytest -q tests/nodesem/test_dataset_a.py -k ${{ matrix.category }}
      - name: nodesem analyze (facts, CODE text, CTX, STATIC) on the real build
        run: python -m nodesem analyze --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg --nodesem out/nodesem
      - name: nodesem encoders, LLM generation and training smoke (access control node, CPU)
        if: matrix.category == 'access_control'
        run: |
          CMAKE_ARGS="-DGGML_NATIVE=OFF" pip install llama-cpp-python==0.3.19
          A="--categories access_control --tasks node --hcg out/hcg --dfg out/dfg --nodesem out/nodesem"
          python -m nodesem encode $A --device cpu
          python -m nodesem describe $A --limit 2
          python -c "from nodesem.encode import encode_teacher; u, v = encode_teacher(['reads the balance', 'checks the caller'], 'cpu'); print(len(u), v.shape)"
          python -m nodesem train $A --configs S0o S2 S4 --folds 0 --epochs 2 --device cpu --out out/runs_nodesem
      - name: edgesem F4 edges and attributes equal the unmodified EdgeSem code and the sealed EdgeSem evidence
        run: python -m pytest -q tests/edgesem/test_dataset_a.py -k ${{ matrix.category }}
      - name: edgesem build on the real build, and P2 training smoke (fold 0, 2 epochs, both tasks)
        run: |
          python -m edgesem build --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg --edgesem out/edgesem
          python -m edgesem train --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg \
            --edgesem out/edgesem --out out/runs_edgesem --profiles G3R G4R-P G4R-A G4R-Api \
            --folds 0 --epochs 2 --device cpu
      - name: Upload manifests, DFG summaries and the smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ matrix.category }}
          path: |
            out/hcg/A/${{ matrix.category }}/manifest.json
            out/dfg/A/${{ matrix.category }}/*/summary.json
            out/runs/report.md
            out/runs_anon/report.md
            out/runs_nodesem/report.md
            out/nodesem/A/*/*/summary.json
            out/runs_edgesem/report.md
            out/runs_benchmark/report.md
            out/runs_benchmark/evaluation.json
            out/edgesem/A/*/*/summary.json
            out/runs/*/task.json
          if-no-files-found: warn
