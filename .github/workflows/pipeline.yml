# pipeline: on a clean machine, build every Dataset A category from source (hcg),
# prove it reproduces the authors' graphs and the Oct 10 label policy, augment it with
# the DFG layers (dfg), prove those match the pre-restructure code and the sealed
# Prompt 8 evidence, and smoke-train both the MANDO-LLM baselines and the DFG
# profiles on the result. CPU only (GitHub runners have no GPU).
name: pipeline

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DGLBACKEND: pytorch
  MANDO_DATA_DIR: ${{ github.workspace }}/data
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          # node_sem/edge_sem hold ~8 GB of sealed artifacts; neither stage imports them.
          sparse-checkout: |
            /*
            !/scripts/node_sem/
            !/scripts/edge_sem/
            !/experiments/
            /experiments/ge-sc-data/source_code/*/source_files/
            !/Test_code/
            /Test_code/label_pipeline/artifacts/public_endpoints_verified_v1/
            !/compile_repair/
            !/docs/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch 2.2 + DGL 2.1, the newest DGL on PyPI)
        run: |
          pip install torch==2.2.1 --index-url https://download.pytorch.org/whl/cpu
          pip install dgl==2.1.0 "numpy<2" requests "pydantic>=2"
          pip install --no-deps torchdata==0.7.1
          pip install "numpy<2" "networkx>=3" tree-sitter==0.20.4 pydot==1.4.2 transformers==4.46.3 \
            scikit-learn scipy pandas matplotlib tensorboard tabulate timebudget \
            torch_geometric pytest
      - name: hcg and dfg unit tests (dfg.train against the sealed Prompt 8 folds/groups)
        run: python -m pytest -q tests/hcg/test_units.py tests/dfg/test_units.py tests/dfg/test_train.py

  category:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        category:
          - access_control
          - arithmetic
          - denial_of_service
          - front_running
          - reentrancy
          - time_manipulation
          - unchecked_low_level_calls
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          # node_sem/edge_sem hold ~8 GB of sealed artifacts; neither stage imports them.
          sparse-checkout: |
            /*
            !/scripts/node_sem/
            !/scripts/edge_sem/
            !/experiments/
            /experiments/ge-sc-data/source_code/*/source_files/
            !/Test_code/
            /Test_code/label_pipeline/artifacts/public_endpoints_verified_v1/
            !/compile_repair/
            !/docs/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch==2.2.1 --index-url https://download.pytorch.org/whl/cpu
          pip install dgl==2.1.0 "numpy<2" requests "pydantic>=2"
          pip install --no-deps torchdata==0.7.1
          pip install "numpy<2" "networkx>=3" tree-sitter==0.20.4 pydot==1.4.2 transformers==4.46.3 \
            scikit-learn scipy pandas matplotlib tensorboard tabulate timebudget \
            torch_geometric pytest
      - name: Fetch pinned label sources
        run: python -m hcg fetch
      - name: hcg build from source (with CodeT5+ tokens), compared with the authors' graphs
        run: python -m hcg build --categories ${{ matrix.category }} --out out/hcg
      - name: hcg reproduces the Oct 10 label policy node for node
        run: python -m pytest -q tests/hcg/test_dataset_a.py -k ${{ matrix.category }}
      - name: MANDO-LLM HGT consumes the graphs (1 epoch, 2 folds; nodetype and tokens; both levels)
        run: |
          B=out/hcg/A/${{ matrix.category }}
          S=experiments/ge-sc-data/source_code/${{ matrix.category }}/source_files
          for F in nodetype inside_token; do
            python -u graph_classifier.py --compressed_graph $B/contract_level.gpickle \
              --label $B/graph_labels.json --dataset $S --testset $S --node_feature $F \
              --output_models /tmp/m/c_$F.pth --log_dir /tmp/l/c_$F \
              --num_epochs 1 --k_folds 2 --seed 1 --no_progress
            python -u node_classifier.py --compressed_graph $B/line_level.gpickle \
              --dataset $S --testset $S --node_feature $F \
              --output_models /tmp/m/n_$F.pth --log_dir /tmp/l/n_$F \
              --num_epochs 1 --k_folds 2 --seed 1 --no_progress
          done
      - name: dfg build L1-L3 (env_source tokens from the same tokenizer)
        run: python -m dfg build --categories ${{ matrix.category }} --hcg out/hcg --out out/dfg
      - name: dfg layers match the pre-restructure code and the sealed Prompt 8 evidence
        run: python -m pytest -q tests/dfg/test_dataset_a.py -k ${{ matrix.category }}
      - name: dfg training smoke (G0 vs G3R, fold 0, 2 epochs, both tasks; original and anonymized views)
        run: |
          python -m dfg train --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg \
            --out out/runs --profiles G0 G3R --folds 0 --epochs 2 --device cpu
          python -m dfg train --categories ${{ matrix.category }} --hcg out/hcg --dfg out/dfg \
            --out out/runs_anon --profiles G0 G3R --folds 0 --epochs 2 --device cpu --features anonymous
      - name: Upload manifests, DFG summaries and the smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ matrix.category }}
          path: |
            out/hcg/A/${{ matrix.category }}/manifest.json
            out/dfg/A/${{ matrix.category }}/*/summary.json
            out/runs/report.md
            out/runs_anon/report.md
            out/runs/*/task.json
          if-no-files-found: warn
